<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant QR Code Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i class="fa-solid font-bold fa-qrcode text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">QR Studio</h1>
                    <p class="text-xs text-slate-400">Instant URL to QR Converter</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="https://github.com" target="_blank" rel="noopener" class="text-xs font-medium px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors flex items-center gap-2">
                    <i class="fa-brands fa-github"></i>
                    <span class="hidden sm:inline">GitHub</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Application -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <!-- Left Controls Column (Form & Customization) -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- URL Input Section -->
                <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl backdrop-blur-sm">
                    <label for="qr-url" class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-link text-brand-500"></i> Target URL or Text
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <input type="url" id="qr-url" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3.5 pr-24 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition text-sm sm:text-base" placeholder="https://yourwebsite.com" value="https://nomistackdeveloper.github.io/Jobs-Schemes/">
                        <button id="btn-clear" type="button" class="absolute right-3 top-1/2 -translate-y-1/2 px-3 py-1 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors">
                            Clear
                        </button>
                    </div>

                    <!-- Common URL Presets -->
                    <div class="mt-4">
                        <span class="text-xs font-medium text-slate-400 block mb-2">Quick Presets:</span>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" class="preset-btn text-xs bg-slate-800/80 hover:bg-brand-600 hover:text-white text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700/50 transition-colors" data-url="https://nomistackdeveloper.github.io/Jobs-Schemes/">Jobs & Schemes</button>
                            <button type="button" class="preset-btn text-xs bg-slate-800/80 hover:bg-brand-600 hover:text-white text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700/50 transition-colors" data-url="https://google.com">Google</button>
                            <button type="button" class="preset-btn text-xs bg-slate-800/80 hover:bg-brand-600 hover:text-white text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700/50 transition-colors" data-url="https://youtube.com">YouTube</button>
                            <button type="button" class="preset-btn text-xs bg-slate-800/80 hover:bg-brand-600 hover:text-white text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700/50 transition-colors" data-url="https://github.com">GitHub</button>
                        </div>
                    </div>
                </div>

                <!-- Customization Panel -->
                <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-6">
                    <h2 class="text-base font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-sliders text-brand-500"></i> Customize Appearance
                    </h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <!-- Foreground Color -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-2">Foreground Color</label>
                            <div class="flex items-center gap-3 bg-slate-950 p-2 border border-slate-800 rounded-xl">
                                <input type="color" id="color-fg" value="#000000" class="w-9 h-9 rounded-lg border-0 bg-transparent cursor-pointer">
                                <input type="text" id="color-fg-hex" value="#000000" class="bg-transparent text-sm font-mono text-slate-200 w-full uppercase focus:outline-none">
                            </div>
                        </div>

                        <!-- Background Color -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-2">Background Color</label>
                            <div class="flex items-center gap-3 bg-slate-950 p-2 border border-slate-800 rounded-xl">
                                <input type="color" id="color-bg" value="#ffffff" class="w-9 h-9 rounded-lg border-0 bg-transparent cursor-pointer">
                                <input type="text" id="color-bg-hex" value="#ffffff" class="bg-transparent text-sm font-mono text-slate-200 w-full uppercase focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <!-- Size & Resolution Slider -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="qr-size" class="text-xs font-semibold text-slate-300">Resolution / Size</label>
                            <span id="size-value" class="text-xs font-mono text-brand-500 font-semibold">300 x 300 px</span>
                        </div>
                        <input type="range" id="qr-size" min="150" max="600" step="25" value="300" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-brand-500">
                    </div>

                    <!-- Custom Logo Overlay -->
                    <div class="pt-2">
                        <label class="block text-xs font-semibold text-slate-300 mb-2 flex items-center justify-between">
                            <span>Center Logo (Optional)</span>
                            <span id="logo-status" class="text-[10px] text-slate-500">None attached</span>
                        </label>
                        <div class="flex items-center gap-3">
                            <label class="flex-1 cursor-pointer bg-slate-950 hover:bg-slate-800 border border-slate-800 border-dashed rounded-xl px-4 py-3 flex items-center justify-center gap-2 text-xs text-slate-300 transition-colors">
                                <i class="fa-solid fa-cloud-arrow-up text-brand-500"></i>
                                <span id="logo-file-name">Upload Logo Image</span>
                                <input type="file" id="logo-input" accept="image/*" class="hidden">
                            </label>
                            <button id="btn-remove-logo" type="button" class="hidden px-3 py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl text-xs transition-colors">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Right Preview Column -->
            <div class="lg:col-span-5 sticky top-24">
                <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 shadow-xl text-center space-y-6 flex flex-col items-center">
                    <div class="w-full flex justify-between items-center border-b border-slate-800 pb-3">
                        <h2 class="text-base font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-eye text-brand-500"></i> Live Preview
                        </h2>
                        <span class="text-[10px] uppercase tracking-wider font-semibold bg-brand-500/10 text-brand-500 px-2.5 py-1 rounded-full border border-brand-500/20">
                            Auto Updating
                        </span>
                    </div>

                    <!-- QR Canvas Preview Card -->
                    <div class="relative p-6 bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-center shadow-inner group w-full max-w-[340px] aspect-square overflow-hidden">
                        <!-- Hidden container for library generation -->
                        <div id="qrcode-raw" class="hidden"></div>
                        <!-- Canvas used for custom drawing (with colors and logo) -->
                        <canvas id="qr-canvas" class="max-w-full max-h-full rounded-lg shadow-md transition-transform duration-300 group-hover:scale-105"></canvas>
                    </div>

                    <!-- Download & Copy Action Buttons -->
                    <div class="w-full space-y-3">
                        <button id="btn-download" type="button" class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                            <i class="fa-solid fa-download"></i>
                            Download PNG
                        </button>

                        <div class="grid grid-cols-2 gap-3">
                            <button id="btn-copy-image" type="button" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 px-3 rounded-xl border border-slate-700/60 flex items-center justify-center gap-2 text-xs transition-colors">
                                <i class="fa-solid fa-copy"></i>
                                Copy Image
                            </button>
                            <button id="btn-copy-url" type="button" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 px-3 rounded-xl border border-slate-700/60 flex items-center justify-center gap-2 text-xs transition-colors">
                                <i class="fa-solid fa-link"></i>
                                Copy Link
                            </button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-950 py-6 mt-12 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4">
            <p>Generated locally in your browser. No URLs or images are sent to external servers.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const urlInput = document.getElementById('qr-url');
            const btnClear = document.getElementById('btn-clear');
            const colorFg = document.getElementById('color-fg');
            const colorFgHex = document.getElementById('color-fg-hex');
            const colorBg = document.getElementById('color-bg');
            const colorBgHex = document.getElementById('color-bg-hex');
            const sizeSlider = document.getElementById('qr-size');
            const sizeValue = document.getElementById('size-value');
            const logoInput = document.getElementById('logo-input');
            const logoFileName = document.getElementById('logo-file-name');
            const logoStatus = document.getElementById('logo-status');
            const btnRemoveLogo = document.getElementById('btn-remove-logo');
            
            const rawQrContainer = document.getElementById('qrcode-raw');
            const mainCanvas = document.getElementById('qr-canvas');
            
            const btnDownload = document.getElementById('btn-download');
            const btnCopyImage = document.getElementById('btn-copy-image');
            const btnCopyUrl = document.getElementById('btn-copy-url');
            const presetBtns = document.querySelectorAll('.preset-btn');

            let currentLogoImage = null;

            function showToast(message, type = 'info') {
                const toastContainer = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-brand-600';
                const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';

                toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium transition-all duration-300 transform translate-x-full opacity-0 pointer-events-auto`;
                toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
                
                toastContainer.appendChild(toast);

                // Animate In
                setTimeout(() => {
                    toast.classList.remove('translate-x-full', 'opacity-0');
                }, 10);

                // Animate Out & Remove
                setTimeout(() => {
                    toast.classList.add('translate-x-full', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            function renderQRCode() {
                const text = urlInput.value.trim() || 'https://nomistackdeveloper.github.io/Jobs-Schemes/';
                const size = parseInt(sizeSlider.value, 10);
                const fg = colorFg.value;
                const bg = colorBg.value;

                // Clear previous raw QR
                rawQrContainer.innerHTML = '';

                try {
                    // Generate raw QR via library
                    const qr = new QRCode(rawQrContainer, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: fg,
                        colorLight: bg,
                        correctLevel: QRCode.CorrectLevel.H // High error correction for center logo support
                    });

                    // Wait briefly for library canvas creation
                    setTimeout(() => {
                        const generatedCanvas = rawQrContainer.querySelector('canvas');
                        if (!generatedCanvas) return;

                        // Set dimensions on main display canvas
                        mainCanvas.width = size;
                        mainCanvas.height = size;
                        const ctx = mainCanvas.getContext('2d');

                        // Draw base QR code image
                        ctx.drawImage(generatedCanvas, 0, 0);

                        // If custom logo image uploaded, overlay it in center
                        if (currentLogoImage) {
                            const logoSize = size * 0.22; // 22% of total QR size
                            const centerPos = (size - logoSize) / 2;

                            // Draw subtle background box for logo
                            ctx.fillStyle = bg;
                            ctx.beginPath();
                            ctx.roundRect(centerPos - 4, centerPos - 4, logoSize + 8, logoSize + 8, 8);
                            ctx.fill();

                            // Draw Logo
                            ctx.drawImage(currentLogoImage, centerPos, centerPos, logoSize, logoSize);
                        }
                    }, 50);

                } catch (err) {
                    console.error('QR Generation Error:', err);
                }
            }

            // Input changes
            urlInput.addEventListener('input', renderQRCode);
            
            btnClear.addEventListener('click', () => {
                urlInput.value = '';
                urlInput.focus();
                renderQRCode();
            });

            // Color pickers synchronization
            colorFg.addEventListener('input', (e) => {
                colorFgHex.value = e.target.value;
                renderQRCode();
            });
            colorFgHex.addEventListener('input', (e) => {
                if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                    colorFg.value = e.target.value;
                    renderQRCode();
                }
            });

            colorBg.addEventListener('input', (e) => {
                colorBgHex.value = e.target.value;
                renderQRCode();
            });
            colorBgHex.addEventListener('input', (e) => {
                if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                    colorBg.value = e.target.value;
                    renderQRCode();
                }
            });

            // Size slider
            sizeSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                sizeValue.textContent = `${val} x ${val} px`;
                renderQRCode();
            });

            // Quick Preset Buttons
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    urlInput.value = btn.getAttribute('data-url');
                    renderQRCode();
                    showToast('Preset URL loaded', 'info');
                });
            });

            // Logo Upload Handler
            logoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showToast('Please upload an image file', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        currentLogoImage = img;
                        logoFileName.textContent = file.name;
                        logoStatus.textContent = 'Attached';
                        logoStatus.className = 'text-[10px] text-emerald-400 font-medium';
                        btnRemoveLogo.classList.remove('hidden');
                        renderQRCode();
                        showToast('Logo overlay applied!', 'success');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // Logo Removal Handler
            btnRemoveLogo.addEventListener('click', () => {
                currentLogoImage = null;
                logoInput.value = '';
                logoFileName.textContent = 'Upload Logo Image';
                logoStatus.textContent = 'None attached';
                logoStatus.className = 'text-[10px] text-slate-500';
                btnRemoveLogo.classList.add('hidden');
                renderQRCode();
                showToast('Logo removed', 'info');
            });

            // Download PNG
            btnDownload.addEventListener('click', () => {
                const dataUrl = mainCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('QR Code downloaded successfully!', 'success');
            });

            // Copy Image to Clipboard
            btnCopyImage.addEventListener('click', async () => {
                try {
                    mainCanvas.toBlob(async (blob) => {
                        if (!blob) {
                            showToast('Failed to copy image', 'error');
                            return;
                        }
                        try {
                            const item = new ClipboardItem({ 'image/png': blob });
                            await navigator.clipboard.write([item]);
                            showToast('QR Code image copied to clipboard!', 'success');
                        } catch (e) {
                            showToast('Copying images not supported in this browser', 'error');
                        }
                    });
                } catch (err) {
                    showToast('Unable to copy image', 'error');
                }
            });

            // Copy URL to Clipboard
            btnCopyUrl.addEventListener('click', () => {
                const urlText = urlInput.value.trim();
                if (!urlText) {
                    showToast('No URL to copy', 'error');
                    return;
                }
                
                // Fallback copy execution
                const tempInput = document.createElement('input');
                tempInput.value = urlText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast('URL copied to clipboard!', 'success');
            });

            // Initial Generation
            renderQRCode();
        });
    </script>
</body>
</html>
